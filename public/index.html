<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marşrut — Kuryer İdarəetmə</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14171F; --navy-2:#1D2130; --paper:#F5F3ED; --card:#FFFFFF; --line:#E6E2D8;
    --ink:#1E2230; --ink-soft:#6B7280; --orange:#FF6A2C; --orange-dim:#FFE4D6;
    --amber:#D97706; --amber-dim:#FDECD0; --teal:#0D9488; --teal-dim:#D7F2EF;
    --green:#16A34A; --green-dim:#DCF7E3; --red:#DC2626; --red-dim:#FBDBDA;
    --radius:14px; --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
  h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{display:flex;flex-direction:column;min-height:100vh;}

  .topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px);border-bottom:3px solid var(--orange);}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;gap:10px;}
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand h1{font-size:20px;font-weight:700;margin:0;letter-spacing:0.2px;}
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);display:inline-block;}
  .who{text-align:right;font-size:11px;color:#AEB3C4;line-height:1.5;}
  .who b{color:#fff;font-size:12.5px;display:block;}
  .who a{color:var(--orange);text-decoration:none;font-weight:600;cursor:pointer;}
  .conn{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:#7B8098;margin-top:1px;}
  .conn .led{width:6px;height:6px;border-radius:50%;background:var(--green);}
  .conn .led.off{background:var(--red);}

  #main{flex:1;padding:16px 16px calc(96px + var(--safe-b));max-width:640px;margin:0 auto;width:100%;}
  .view{animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600;margin:22px 0 10px;}
  .sec-title:first-child{margin-top:0;}
  .sec-title .cnt{background:var(--orange);color:#fff;border-radius:99px;padding:1px 8px;font-size:11px;margin-left:6px;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;position:relative;overflow:hidden;}
  .stat-card .num{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;line-height:1;}
  .stat-card .lbl{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .stat-card.accent{background:var(--navy);color:#fff;}
  .stat-card.accent .lbl{color:#9AA0B4;}
  .stat-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .stat-card .bar.orange{background:var(--orange);} .stat-card .bar.teal{background:var(--teal);}
  .stat-card .bar.green{background:var(--green);} .stat-card .bar.amber{background:var(--amber);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
  .card.pulse{animation:pulseIn .6s ease;}
  @keyframes pulseIn{0%{box-shadow:0 0 0 0 rgba(255,106,44,.45)}100%{box-shadow:0 0 0 10px rgba(255,106,44,0)}}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-top .name{font-weight:600;font-size:15.5px;}
  .card-top .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .fee{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;white-space:nowrap;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:99px;}
  .badge.yeni{background:#EEF0F4;color:var(--ink-soft);}
  .badge.tayin{background:var(--amber-dim);color:var(--amber);}
  .badge.yolda{background:var(--teal-dim);color:var(--teal);}
  .badge.catdirildi{background:var(--green-dim);color:var(--green);}
  .badge.legv{background:var(--red-dim);color:var(--red);}
  .badge.aktiv{background:var(--green-dim);color:var(--green);}
  .badge.passiv{background:#EEF0F4;color:var(--ink-soft);}

  .route{display:flex;align-items:center;margin:12px 0 4px;}
  .route .stop{width:9px;height:9px;border-radius:50%;background:var(--line);flex-shrink:0;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);}
  .route .stop.done{background:var(--orange);box-shadow:0 0 0 1px var(--orange);}
  .route .seg{flex:1;height:2px;background:var(--line);}
  .route .seg.done{background:var(--orange);}
  .route-labels{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink-soft);margin-bottom:2px;}
  .route-labels span{flex:1;text-align:center;}
  .route-labels span:first-child{text-align:left;} .route-labels span:last-child{text-align:right;}

  .card-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .card-meta{font-size:12.5px;color:var(--ink-soft);margin-top:8px;display:flex;gap:14px;flex-wrap:wrap;}
  .card-meta b{color:var(--ink);font-weight:600;}

  .btn{border:none;border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--navy);color:#fff;} .btn-orange{background:var(--orange);color:#fff;}
  .btn-teal{background:var(--teal);color:#fff;} .btn-ghost{background:#EEF0F4;color:var(--ink);}
  .btn-danger{background:var(--red-dim);color:var(--red);}
  .btn-sm{padding:6px 10px;font-size:12px;} .btn:active{transform:scale(.97);}
  .btn-block{width:100%;justify-content:center;} .btn[disabled]{opacity:.5;pointer-events:none;}
  select.inline-select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif;background:#fff;flex:1;min-width:120px;}

  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;padding:7px 13px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .search{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px;background:#fff;font-family:'Inter',sans-serif;}

  .empty{text-align:center;padding:48px 20px;color:var(--ink-soft);}
  .empty .glyph{font-size:34px;margin-bottom:10px;opacity:.5;}
  .empty p{font-size:13.5px;margin:4px 0 0;line-height:1.5;} .empty b{color:var(--ink);}

  .fab{position:fixed;right:18px;bottom:calc(84px + var(--safe-b));z-index:25;width:52px;height:52px;border-radius:16px;background:var(--orange);color:#fff;border:none;box-shadow:0 8px 20px rgba(255,106,44,.35);font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .fab:active{transform:scale(.94);}

  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--navy);display:flex;padding:8px 8px calc(8px + var(--safe-b));border-top:1px solid #262B3B;}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:#7B8098;padding:6px 2px;cursor:pointer;font-family:'Inter',sans-serif;position:relative;}
  .navbtn svg{width:21px;height:21px;} .navbtn span{font-size:10.5px;font-weight:600;}
  .navbtn.active{color:#fff;} .navbtn.active svg{stroke:var(--orange);}
  .navbtn .dotcnt{position:absolute;top:2px;right:22%;background:var(--orange);color:#fff;font-size:9.5px;font-weight:700;border-radius:99px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

  .modal-bg{position:fixed;inset:0;background:rgba(20,23,31,.55);z-index:40;display:none;align-items:flex-end;justify-content:center;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--paper);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 18px calc(22px + var(--safe-b));max-height:88vh;overflow-y:auto;animation:slideup .22s ease;position:relative;}
  @keyframes slideup{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .modal h2{font-size:18px;margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;font-family:'Inter',sans-serif;background:#fff;}
  .field textarea{resize:vertical;min-height:56px;}
  .field-row{display:flex;gap:10px;} .field-row .field{flex:1;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;}

  #toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:60;opacity:0;transition:all .25s ease;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:88vw;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .report-tabs{display:flex;gap:8px;margin-bottom:16px;} .report-tabs .chip{flex:1;text-align:center;}
  .rep-table{width:100%;border-collapse:collapse;font-size:13px;}
  .rep-table th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:0 0 8px;border-bottom:1px solid var(--line);}
  .rep-table td{padding:10px 0;border-bottom:1px solid var(--line);} .rep-table tr:last-child td{border-bottom:none;}

  /* ---- Role gate ---- */
  .gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;background:var(--navy);color:#fff;}
  .gate-inner{max-width:420px;margin:0 auto;width:100%;}
  .gate .dot{width:9px;height:9px;border-radius:50%;background:var(--orange);display:inline-block;margin-bottom:14px;}
  .gate h1{font-size:26px;margin:0 0 6px;}
  .gate p.lead{color:#9AA0B4;font-size:14px;margin:0 0 28px;line-height:1.5;}
  .role-opt{display:flex;align-items:center;gap:14px;background:var(--navy-2);border:1px solid #2A2F42;border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;}
  .role-opt:active{transform:scale(.98);}
  .role-opt .ic{width:44px;height:44px;border-radius:12px;background:var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .role-opt .ic svg{width:22px;height:22px;stroke:#fff;}
  .role-opt .tt{font-weight:700;font-size:15px;} .role-opt .dd{font-size:12.5px;color:#9AA0B4;margin-top:2px;}
  .courier-pick{background:var(--navy-2);border:1px solid #2A2F42;border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .courier-pick .tt{font-weight:600;font-size:14.5px;}
  .courier-pick .dd{font-size:12px;color:#9AA0B4;}
  .backlink{color:#9AA0B4;font-size:13px;background:none;border:none;cursor:pointer;padding:10px 0;text-decoration:underline;}
</style>
</head>
<body>

<div id="gate" class="gate" style="display:none;"></div>

<div id="app" style="display:none;">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="dot"></span><h1>Marşrut</h1></div>
      <div class="who" id="whoBox"></div>
    </div>
  </header>
  <main id="main"></main>
  <button class="fab" id="fabBtn" onclick="openFab()">+</button>
  <nav class="bottomnav" id="bottomNav"></nav>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<div id="toast"></div>

<script>
/* ===================== STATE ===================== */
let state = { orders: [], couriers: [] };
let role = localStorage.getItem('marsrut_role');       // 'admin' | 'courier'
let myCourierId = localStorage.getItem('marsrut_courier_id') || null;
let adminToken = localStorage.getItem('marsrut_admin_token') || null;
let view = null;
let orderFilter = 'hamisi';
let orderSearch = '';
let reportRange = 'today';
let courierTab = 'yeni';
let knownOrderIds = new Set();
let firstLoad = true;
let modalOpen = false;

/* ===================== API ===================== */
async function api(path, opts){
  const res = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((data && data.error) || 'Xəta baş verdi');
  return data;
}
// İdarəçi girişi tələb edən sorğular üçün (sifariş/kuryer yaratmaq və silmək)
async function adminApi(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json','X-Admin-Token': adminToken || ''}, opts.headers||{});
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(res.status===401){
    toast('Sessiya bitib, yenidən daxil ol');
    switchRole();
    throw new Error('Sessiya bitib');
  }
  if(!res.ok) throw new Error((data && data.error) || 'Xəta baş verdi');
  return data;
}
async function fetchState(){
  try{
    const data = await api('/api/state');
    state = data;
    setConn(true);
    checkNewOrders();
    if(!modalOpen) render();
  }catch(e){
    setConn(false);
  }
}
function setConn(ok){
  const el = document.getElementById('connLed');
  if(el) el.classList.toggle('off', !ok);
}
function checkNewOrders(){
  const ids = new Set(state.orders.map(o=>o.id));
  if(!firstLoad){
    const newOnes = state.orders.filter(o=>!knownOrderIds.has(o.id) && o.status==='yeni');
    if(newOnes.length && role==='courier'){
      toast(newOnes.length===1 ? 'Yeni sifariş daxil oldu!' : newOnes.length+' yeni sifariş daxil oldu!');
      try{ navigator.vibrate && navigator.vibrate([80,40,80]); }catch(e){}
    }
  }
  knownOrderIds = ids;
  firstLoad = false;
}
setInterval(fetchState, 4000);

/* ===================== HELPERS ===================== */
const STATUS_LABEL = { yeni:'Yeni', tayin:'Təyin edilib', yolda:'Yolda', catdirildi:'Çatdırıldı', legv:'Ləğv edilib' };
const STATUS_ORDER = ['yeni','tayin','yolda','catdirildi'];
function fmtMoney(n){ return (Number(n)||0).toFixed(2).replace(/\.00$/,'') + ' ₼'; }
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString('az-AZ',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('az-AZ',{hour:'2-digit',minute:'2-digit'}); }
function todayStr(){ return new Date().toLocaleDateString('az-AZ',{weekday:'long', day:'2-digit', month:'long'}); }
function isSameDay(ts, ref){ const a=new Date(ts); return a.getFullYear()===ref.getFullYear() && a.getMonth()===ref.getMonth() && a.getDate()===ref.getDate(); }
function inRange(ts, range){
  const now = new Date(); const d = new Date(ts);
  if(range==='today') return isSameDay(ts, now);
  if(range==='week'){ const w=new Date(now); w.setDate(now.getDate()-7); return d>=w; }
  if(range==='month') return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  return true;
}
function courierById(id){ return state.couriers.find(c=>c.id===id); }
function activeOrdersFor(courierId){ return state.orders.filter(o=>o.courierId===courierId && (o.status==='tayin'||o.status==='yolda')).length; }
function vehicleLabel(v){ return {motosiklet:'Motosiklet', avtomobil:'Avtomobil', velosiped:'Velosiped', piyada:'Piyada'}[v] || v; }
function escapeHTML(str){ return String(str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastT); window._toastT = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ===================== ROLE GATE ===================== */
function showGate(){
  document.getElementById('app').style.display = 'none';
  const gate = document.getElementById('gate');
  gate.style.display = 'flex';
  gate.innerHTML = `
    <div class="gate-inner">
      <span class="dot"></span>
      <h1>Marşrut</h1>
      <p class="lead">Kuryer idarəetmə sisteminə xoş gəldin. Rolunu seç:</p>
      <div class="role-opt" onclick="showAdminLogin()">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></div>
        <div><div class="tt">İdarəçiyəm</div><div class="dd">Sifariş yarat, kuryerləri idarə et, hesabata bax</div></div>
      </div>
      <div class="role-opt" onclick="showCourierPick()">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M9 18h6"/><path d="M6 15l2-8h4l1 3h4"/></svg></div>
        <div><div class="tt">Kuryeryəm</div><div class="dd">Yeni sifarişlərə bax, özünə təyin et</div></div>
      </div>
    </div>
  `;
}
async function showCourierPick(){
  try{ state = await api('/api/state'); }catch(e){}
  const gate = document.getElementById('gate');
  const list = state.couriers;
  gate.innerHTML = `
    <div class="gate-inner">
      <span class="dot"></span>
      <h1>Sən kimsən?</h1>
      <p class="lead">Siyahıdan öz adını seç.</p>
      ${list.length===0 ? `
        <p style="color:#9AA0B4;font-size:13.5px;line-height:1.6;">Hələ kuryer əlavə olunmayıb. İdarəçidən səni sistemə əlavə etməsini xahiş et.</p>
      ` : list.map(c=>`
        <div class="courier-pick" onclick="chooseCourier('${c.id}')">
          <div><div class="tt">${escapeHTML(c.name)}</div><div class="dd">${escapeHTML(vehicleLabel(c.vehicle))}</div></div>
          <span style="color:#7B8098;">›</span>
        </div>
      `).join('')}
      <button class="backlink" onclick="showGate()">‹ Geri</button>
    </div>
  `;
}
function chooseCourier(id){
  localStorage.setItem('marsrut_role','courier');
  localStorage.setItem('marsrut_courier_id', id);
  role='courier'; myCourierId=id;
  startApp();
}
function showAdminLogin(){
  const gate = document.getElementById('gate');
  gate.innerHTML = `
    <div class="gate-inner">
      <span class="dot"></span>
      <h1>İdarəçi girişi</h1>
      <p class="lead">Panelə daxil olmaq üçün şifrəni yaz.</p>
      <div class="field">
        <label style="color:#9AA0B4;">Şifrə</label>
        <input id="admin-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') submitAdminLogin()">
      </div>
      <button class="btn btn-orange btn-block" id="adminLoginBtn" onclick="submitAdminLogin()">Daxil ol</button>
      <button class="backlink" onclick="showGate()">‹ Geri</button>
    </div>
  `;
  setTimeout(()=>{ const el=document.getElementById('admin-pass'); if(el) el.focus(); }, 60);
}
async function submitAdminLogin(){
  const el = document.getElementById('admin-pass');
  const pass = el ? el.value : '';
  const btn = document.getElementById('adminLoginBtn');
  btn.disabled = true;
  try{
    const data = await api('/api/admin-login', { method:'POST', body: JSON.stringify({ password: pass }) });
    localStorage.setItem('marsrut_role','admin');
    localStorage.setItem('marsrut_admin_token', data.token);
    role='admin'; adminToken=data.token;
    startApp();
  }catch(e){
    toast(e.message || 'Şifrə yanlışdır');
    btn.disabled = false;
  }
}
function switchRole(){
  localStorage.removeItem('marsrut_role');
  localStorage.removeItem('marsrut_courier_id');
  localStorage.removeItem('marsrut_admin_token');
  role=null; myCourierId=null; adminToken=null;
  showGate();
}

/* ===================== APP SHELL ===================== */
function startApp(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  buildNav();
  const who = document.getElementById('whoBox');
  if(role==='admin'){

/* ===================== ROUTE DOTS ===================== */
function routeHTML(status){
  if(status==='legv') return `<div class="badge legv" style="margin-top:10px;">✕ Ləğv edilib</div>`;
  const idx = STATUS_ORDER.indexOf(status);
  let dots = '';
  STATUS_ORDER.forEach((s,i)=>{
    dots += `<div class="stop ${i<=idx?'done':''}"></div>`;
    if(i<STATUS_ORDER.length-1) dots += `<div class="seg ${i<idx?'done':''}"></div>`;
  });
  return `<div class="route">${dots}</div><div class="route-labels"><span>Yeni</span><span>Təyin</span><span>Yolda</span><span>Çatdı</span></div>`;
}

  const deliveredToday = todays.filter(o=>o.status==='catdirildi').length;

function orderActionsHTML(o){

    const opts = state.couriers.filter(c=>c.status==='aktiv');
    if(opts.length===0) return `<div class="card-actions"><span class="sub" style="font-size:12px;">Təyin etmək üçün əvvəl aktiv kuryer əlavə et.</span></div>`;

  if(o.status==='tayin'){
    return `<div class="card-actions">
      <button class="btn btn-teal btn-sm" onclick="setOrderStatus('${o.id}','yolda')">Yolda kimi qeyd et</button>
      <button class="btn btn-danger btn-sm" onclick="setOrderStatus('${o.id}','legv')">Ləğv et</button>

    return `<div class="card-actions"><button class="btn btn-primary btn-sm" onclick="setOrderStatus('${o.id}','catdirildi')">Çatdırıldı kimi qeyd et</button></div>`;
  }

/* ===================== ADMIN: REPORTS ===================== */
function renderReports(){
  const ranges = [['today','Bugün'],['week','Bu həftə'],['month','Bu ay'],['all','Hamısı']];
  const done = state.orders.filter(o=>o.status==='catdirildi' && inRange(o.createdAt, reportRange));
  const totalOrders = state.orders.filter(o=>inRange(o.createdAt, reportRange)).length;
  const revenue = done.reduce((s,o)=>s+(Number(o.fee)||0),0);
  const payout = done.reduce((s,o)=>s+(Number(o.courierFee)||0),0);
  const profit = revenue - payout;
  const perCourier = state.couriers.map(c=>{
    const co = done.filter(o=>o.courierId===c.id);
    return { name:c.name, count:co.length, earned: co.reduce((s,o)=>s+(Number(o.courierFee)||0),0) };
  }).filter(r=>r.count>0).sort((a,b)=>b.earned-a.earned);
  return `
    <div class="view">
      <div class="report-tabs">${ranges.map(([k,l])=>`<div class="chip ${reportRange===k?'active':''}" onclick="reportRange='${k}'; render();">${l}</div>`).join('')}</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="bar orange"></div><div class="num">${totalOrders}</div><div class="lbl">Ümumi sifariş</div></div>
        <div class="stat-card"><div class="bar green"></div><div class="num">${done.length}</div><div class="lbl">Çatdırılmış</div></div>
        <div class="stat-card accent"><div class="num mono">${fmtMoney(revenue)}</div><div class="lbl">Ümumi gəlir</div></div>
        <div class="stat-card"><div class="bar amber"></div><div class="num mono">${fmtMoney(payout)}</div><div class="lbl">Kuryer ödənişi</div></div>
      </div>
      <div class="stat-card" style="margin-top:10px;background:var(--navy);color:#fff;">
        <div class="num mono" style="color:${profit>=0?'#5EEAD4':'#FCA5A5'};">${fmtMoney(profit)}</div><div class="lbl">Xalis mənfəət</div>
      </div>
      <div class="sec-title">Kuryerlər üzrə bölgü</div>
      ${perCourier.length===0 ? `<div class="empty"><div class="glyph">◎</div><p>Bu dövrdə çatdırılmış sifariş yoxdur.</p></div>` : `
        <table class="rep-table"><thead><tr><th>Kuryer</th><th>Sifariş</th><th>Qazanc</th></tr></thead>
        <tbody>${perCourier.map(r=>`<tr><td>${escapeHTML(r.name)}</td><td>${r.count}</td><td class="mono">${fmtMoney(r.earned)}</td></tr>`).join('')}</tbody></table>
      `}
    </div>
  `;
}

async function submitCourier(){
  const name = document.getElementById('c-name').value.trim();
  if(!name){ toast('Zəhmət olmasa adı daxil et'); return; }
  const btn = document.getElementById('submitCourierBtn'); btn.disabled = true;
  try{
    await adminApi('/api/couriers', { method:'POST', body: JSON.stringify({
      name, phone: document.getElementById('c-phone').value.trim(), vehicle: document.getElementById('c-vehicle').value
    })});
    closeModal();
    toast('Kuryer əlavə edildi');
    await fetchState();
    switchView('couriers');
  }catch(e){ toast(e.message); btn.disabled = false; }
}

/* ===================== ACTIONS ===================== */
async function assignCourier(orderId){
  const sel = document.getElementById('sel-'+orderId);
  if(!sel || !sel.value) return;
  try{
    await api('/api/orders/'+orderId+'/assign', { method:'POST', body: JSON.stringify({ courierId: sel.value }) });
    toast('Sifariş kuryerə təyin edildi');
    await fetchState();
  }catch(e){ toast(e.message); await fetchState(); }
}
async function setOrderStatus(orderId, status){
  try{
    await api('/api/orders/'+orderId+'/status', { method:'POST', body: JSON.stringify({ status }) });
    const msgs = { yolda:'Sifariş yolda kimi qeyd edildi', catdirildi:'Sifariş çatdırıldı', legv:'Sifariş ləğv edildi' };
    toast(msgs[status] || 'Yeniləndi');
    await fetchState();
  }catch(e){ toast(e.message); }
}
async function deleteOrder(orderId){
  try{ await adminApi('/api/orders/'+orderId, { method:'DELETE' }); toast('Sifariş silindi'); await fetchState(); }
  catch(e){ toast(e.message); }
}
async function toggleCourierStatus(id){
  const c = courierById(id);
  const next = c.status==='aktiv' ? 'passiv' : 'aktiv';
  try{ await api('/api/couriers/'+id+'/status', { method:'POST', body: JSON.stringify({ status: next }) }); await fetchState(); }
  catch(e){ toast(e.message); }
}
async function deleteCourier(id){
  try{ await adminApi('/api/couriers/'+id, { method:'DELETE' }); toast('Kuryer silindi'); await fetchState(); }
  catch(e){ toast(e.message); }
}

/* ===================== INIT ===================== */
(function init(){
  if((role==='admin' && adminToken) || (role==='courier' && myCourierId)){
    startApp();
  }else{
    showGate();
  }
})();
</script>
