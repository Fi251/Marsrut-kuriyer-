<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sifarişi izlə — Marşrut</title>
<meta name="theme-color" content="#14171F">
<link rel="icon" href="/icons/icon-courier-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  body{ padding-bottom: 40px; }
  #main{ padding: 16px; max-width: 560px; margin: 0 auto; }
  .trk-map{ width:100%; height:46vh; border-radius:14px; overflow:hidden; border:1px solid var(--line); margin-top:14px; background:#EEF0F4; }
  .trk-head{ text-align:center; padding: 28px 12px 6px; }
  .trk-head .dot{ width:9px;height:9px;border-radius:50%;background:var(--orange);display:inline-block;margin-bottom:10px; }
  .trk-head h1{ font-size:20px; margin:0; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="dot"></span><h1>Marşrut</h1></div>
    <div class="who"><b>Sifariş izləmə</b></div>
  </div>
</header>

<main id="main">
  <div id="content" class="empty"><p>Yüklənir...</p></div>
</main>

<script>
const params = new URLSearchParams(location.search);
const orderId = params.get('sifaris');
let map = null, marker = null;
const STATUS_LABEL = { yeni:'Yeni', tayin:'Təyin edilib', yolda:'Yolda', catdirildi:'Çatdırıldı', legv:'Ləğv edilib' };
const STATUS_ORDER = ['yeni','tayin','yolda','catdirildi'];

function escapeHTML(str){ return String(str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString('az-AZ',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('az-AZ',{hour:'2-digit',minute:'2-digit'}); }
function routeHTML(status){
  if(status==='legv') return `<div class="badge legv" style="margin-top:10px;">✕ Ləğv edilib</div>`;
  const idx = STATUS_ORDER.indexOf(status);
  let dots = '';
  STATUS_ORDER.forEach((s,i)=>{
    dots += `<div class="stop ${i<=idx?'done':''}"></div>`;
    if(i<STATUS_ORDER.length-1) dots += `<div class="seg ${i<idx?'done':''}"></div>`;
  });
  return `<div class="route">${dots}</div><div class="route-labels"><span>Yeni</span><span>Təyin</span><span>Yolda</span><span>Çatdı</span></div>`;
}

async function load(){
  if(!orderId){
    document.getElementById('content').innerHTML = `<div class="empty"><div class="glyph">◎</div><p><b>İzləmə linki yanlışdır.</b><br>Kuryer və ya idarəçidən düzgün linki al.</p></div>`;
    return;
  }
  try{
    const res = await fetch('/api/track/' + orderId);
    if(!res.ok){
      document.getElementById('content').innerHTML = `<div class="empty"><div class="glyph">◎</div><p><b>Sifariş tapılmadı.</b></p></div>`;
      return;
    }
    const o = await res.json();
    render(o);
  }catch(e){
    document.getElementById('content').innerHTML = `<div class="empty"><p>Bağlantı xətası. Bir azdan yenidən cəhd et.</p></div>`;
  }
}

function render(o){
  const showMap = o.status==='yolda' && o.courierLocation;
  document.getElementById('content').innerHTML = `
    <div class="trk-head">
      <span class="dot"></span>
      <h1>${escapeHTML(o.customerName)}</h1>
      <div class="sub" style="color:var(--ink-soft);">${escapeHTML(o.address)}</div>
    </div>
    <div class="card">
      <div class="card-top">
        <div><div class="name">Sifariş statusu</div><div class="sub">${fmtDate(o.createdAt)}</div></div>
        <span class="badge ${o.status}">${STATUS_LABEL[o.status]}</span>
      </div>
      ${routeHTML(o.status)}
    </div>
    ${o.courierName ? `
      <div class="card">
        <div class="card-top">
          <div><div class="name">🚴 ${escapeHTML(o.courierName)}</div><div class="sub">${escapeHTML(o.courierVehicle||'')}</div></div>
          ${o.courierPhone ? `<a class="btn btn-orange btn-sm" href="tel:${escapeHTML(o.courierPhone)}">Zəng et</a>` : ''}
        </div>
      </div>
    ` : ''}
    ${showMap ? `<div id="trkMap" class="trk-map"></div><p style="text-align:center;font-size:12px;color:var(--ink-soft);margin-top:8px;">Kuryerin canlı yeri — bir neçə saniyədə yenilənir</p>`
      : (o.status==='yolda' ? `<div class="empty" style="padding:20px 12px;"><p>Kuryer hələ yerini paylaşmayıb.</p></div>` : '')}
  `;
  if(showMap) initMap(o.courierLocation);
}
function initMap(loc){
  const el = document.getElementById('trkMap');
  if(!el || typeof L === 'undefined') return;
  if(!map){
    map = L.map(el, { attributionControl:false }).setView([loc.lat, loc.lng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    L.control.attribution({ prefix:false }).addAttribution('© OpenStreetMap').addTo(map);
    marker = L.marker([loc.lat, loc.lng]).addTo(map);
  }else{
    map.setView([loc.lat, loc.lng]);
    marker.setLatLng([loc.lat, loc.lng]);
  }
}

load();
setInterval(load, 6000);
</script>
</body>
</html>
